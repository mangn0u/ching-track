version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: chingtrack_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chingtrack
      POSTGRES_USER: chingtrack_user
      POSTGRES_PASSWORD: chingtrack_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

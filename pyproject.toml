[project]
name = "ching-track"
version = "0.1.0"
description = "Personal Finance Tracker — Django REST API + React SPA"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.3",
    "psycopg2-binary>=2.9",
    "python-decouple>=3.8",
    "django-ratelimit>=4.1",
    "drf-spectacular>=0.27",
    "django-extensions>=3.2",
    "Faker>=24.0",
    "gunicorn>=21.2",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.3",
    "ipython>=8.0",
]

[tool.uv]
package = false
